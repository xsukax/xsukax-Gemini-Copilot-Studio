<script>
(() => {
'use strict';
const API='https://generativelanguage.googleapis.com/v1beta';
const STORAGE='xsukax.gemini.copilot.vault.v1';
const APP='xsukax-gemini-copilot-studio';
const KDF_ITERATIONS=260000;
const $=id=>document.getElementById(id);
const te=new TextEncoder(),td=new TextDecoder();
let data=null, vaultPassword='', busy=null, saving=Promise.resolve(),saveTimer=0, saveEpoch=0, pendingSaves=0, modalOpen=false;
let pendingImport=null, savedAvailable=false, lastFocused=null;
const id=()=>crypto.randomUUID?.()||'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const now=()=>new Date().toISOString();
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const usableName=name=>typeof name==='string'&&/^models\/[\w.-]+$/.test(name);
const cleanError=e=>e?.name==='AbortError'?'Stopped by user.':e instanceof TypeError?'Network request failed. Check connectivity, API key restrictions, or browser CORS settings. If you opened this file directly, try using http://localhost.':e?.message||String(e);
const setStatus=s=>{$('save-status').textContent=s;};
const toB64=b=>{const a=new Uint8Array(b);let s='';for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode(...a.subarray(i,i+8192));return btoa(s);};
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function ensureCrypto(){if(!crypto?.subtle||!crypto?.getRandomValues)throw Error('Web Crypto is unavailable in this browser context. Open the file in a modern browser, or serve it from http://localhost.');}
async function derive(password,salt,iterations){const base=await crypto.subtle.importKey('raw',te.encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function seal(payload,password){ensureCrypto();if(!password)throw Error('Encryption password is required.');const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const key=await derive(password,salt,KDF_ITERATIONS);const bytes=te.encode(JSON.stringify(payload));const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes);return{format:'xsukax-encrypted-json',version:1,app:APP,cipher:'AES-256-GCM',kdf:'PBKDF2-SHA-256',iterations:KDF_ITERATIONS,salt:toB64(salt),iv:toB64(iv),ciphertext:toB64(encrypted)};}
async function unseal(box,password){ensureCrypto();if(!box||box.format!=='xsukax-encrypted-json'||box.version!==1||box.app!==APP||box.cipher!=='AES-256-GCM'||box.kdf!=='PBKDF2-SHA-256'||!Number.isSafeInteger(box.iterations)||box.iterations<100000||box.iterations>1200000)throw Error('Not a supported xsukax encrypted backup/vault.');try{const salt=fromB64(box.salt),iv=fromB64(box.iv),ct=fromB64(box.ciphertext);if(salt.length!==16||iv.length!==12||ct.length<17)throw Error('Invalid encrypted data.');const key=await derive(password,salt,box.iterations);return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct)));}catch(e){if(e?.message==='Invalid encrypted data.')throw e;throw Error('Decryption failed. Check the password and integrity of the file.');}}
function defaultCopilot(){return{id:'general',name:'General Assistant',icon:'✦',description:'Everyday questions and tasks',systemPrompt:'You are a helpful, accurate and clear assistant. Adapt to the language and task of the user.',model:'',temperature:null,maxOutputTokens:null};}
function newData(key,models){return{schema:1,apiKey:key,models,defaultModel:models[0]?.name||'',copilots:[defaultCopilot()],chats:[],activeChatId:null,activeCopilotId:'general',createdAt:now(),updatedAt:now()};}
function validateData(obj){
 if(!obj||obj.schema!==1||typeof obj.apiKey!=='string'||!Array.isArray(obj.copilots)||!Array.isArray(obj.chats)||!Array.isArray(obj.models))throw Error('The decrypted file does not contain a compatible workspace.');
 if(obj.copilots.length>500||obj.chats.length>20000)throw Error('Workspace is too large or invalid.');
 obj.models=obj.models.filter(m=>m&&usableName(m.name)).map(m=>({name:m.name,label:String(m.label||m.name).slice(0,200),maxTemperature:Number.isFinite(m.maxTemperature)?m.maxTemperature:undefined}));
 obj.copilots=obj.copilots.filter(c=>c&&typeof c.id==='string'&&typeof c.name==='string').map(c=>({id:c.id.slice(0,100),name:c.name.slice(0,100),icon:String(c.icon||'✦').slice(0,8),description:String(c.description||'').slice(0,500),systemPrompt:String(c.systemPrompt||'').slice(0,100000),model:usableName(c.model)?c.model:'',temperature:(typeof c.temperature==='number'&&Number.isFinite(c.temperature)&&c.temperature>=0&&c.temperature<=2)?c.temperature:null,maxOutputTokens:(Number.isInteger(c.maxOutputTokens)&&c.maxOutputTokens>=1&&c.maxOutputTokens<=65536)?c.maxOutputTokens:null}));
 if(!obj.copilots.length)obj.copilots=[defaultCopilot()];
 const validIds=new Set(obj.copilots.map(c=>c.id));
 obj.chats=obj.chats.filter(c=>c&&typeof c.id==='string'&&Array.isArray(c.messages)).map(c=>({id:c.id.slice(0,100),title:String(c.title||'New conversation').slice(0,180),copilotId:validIds.has(c.copilotId)?c.copilotId:obj.copilots[0].id,model:usableName(c.model)?c.model:(obj.defaultModel||obj.models[0]?.name||''),createdAt:String(c.createdAt||now()),updatedAt:String(c.updatedAt||now()),messages:c.messages.slice(0,20000).filter(m=>m&&['user','model','error'].includes(m.role)&&typeof m.text==='string').map(m=>({id:String(m.id||id()),role:m.role,text:m.text.slice(0,2000000),createdAt:String(m.createdAt||now()),incomplete:!!m.incomplete,apiParts:Array.isArray(m.apiParts)?m.apiParts.slice(0,4000):undefined}))}));
 obj.defaultModel=usableName(obj.defaultModel)?obj.defaultModel:(obj.models[0]?.name||'');
 if(!validIds.has(obj.activeCopilotId))obj.activeCopilotId=obj.copilots[0].id;
 if(!obj.chats.some(c=>c.id===obj.activeChatId))obj.activeChatId=obj.chats[0]?.id||null;
 return obj;
}
function queueSave(delay=500){if(!data||!vaultPassword)return;clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveTimer=0;void saveNow();},delay);}
async function saveNow(){
 if(!data||!vaultPassword)return false;clearTimeout(saveTimer);saveTimer=0;const epoch=++saveEpoch;data.updatedAt=now();const snapshot=JSON.stringify({type:'vault',app:APP,data});const pass=vaultPassword;pendingSaves++;
 setStatus('Encrypting changes…');
 saving=saving.catch(()=>{}).then(async()=>{const envelope=await seal(JSON.parse(snapshot),pass);if(epoch===saveEpoch&&data&&vaultPassword===pass){try{localStorage.setItem(STORAGE,JSON.stringify(envelope));setStatus('Encrypted & saved locally');savedAvailable=true;}catch(e){setStatus('Local save unavailable — export a backup');showToast('Local storage failed: '+cleanError(e),true);throw e;}}});
 try{await saving;return true;}catch(e){setStatus('Save failed');showToast('Encryption failed: '+cleanError(e),true);return false;}finally{pendingSaves=Math.max(0,pendingSaves-1);}
}
function copilotById(cid){return data?.copilots.find(c=>c.id===cid)||data?.copilots[0];}
function activeChat(){return data?.chats.find(c=>c.id===data.activeChatId)||null;}
function modelLabel(name){return data?.models.find(m=>m.name===name)?.label||String(name||'Choose model').replace(/^models\//,'');}
function option(select,items,sel){select.replaceChildren();for(const m of items)select.add(new Option(m.label,m.name));if(sel&&[...select.options].some(o=>o.value===sel))select.value=sel;}
function allowModel(name){return usableName(name)&&!data.models.some(m=>m.name===name)?[{name,label:`${name.replace('models/','')} (not in latest list)`},...data.models]:data.models;}
function showToast(message,error=false){const existing=$('toast');if(existing)existing.remove();const t=document.createElement('div');t.id='toast';t.textContent=message;t.style.cssText='position:fixed;z-index:90;right:18px;bottom:20px;max-width:min(430px,94vw);padding:12px 16px;background:'+(error?'#522634':'#284844')+';border:1px solid '+(error?'#8e475a':'#488779')+';border-radius:11px;box-shadow:0 15px 40px #0008;color:white;line-height:1.45';document.body.append(t);setTimeout(()=>t.remove(),5500);}
async function apiJSON(url,key,options={}){const response=await fetch(url,{...options,headers:{...(options.headers||{}),'x-goog-api-key':key}});const raw=await response.text();let result={};try{result=JSON.parse(raw||'{}');}catch{throw Error('Google returned a non-JSON response (HTTP '+response.status+').');}if(!response.ok||result.error)throw Error('HTTP '+response.status+': '+(result.error?.message||response.statusText));return result;}

 const found=new Map();for(const m of arr){const methods=m.supportedGenerationMethods||m.supportedActions||[];if(!usableName(m.name)||!methods.includes('generateContent'))continue;found.set(m.name,{name:m.name,label:(m.displayName?m.displayName+' · ':'')+m.name.slice(7),maxTemperature:Number.isFinite(m.maxTemperature)?m.maxTemperature:undefined});}const list=[...found.values()].sort((a,b)=>a.label.localeCompare(b.label));if(!list.length)throw Error('No text-generation models are available to this API key.');return list;}

function gateUnlock(error=''){

function createChat(copilotId){if(!data)return;if(busy){showToast('Stop the current response before creating a new chat.');return;}const cp=copilotById(copilotId||data.activeCopilotId);const chat={id:id(),title:'New conversation',copilotId:cp.id,model:cp.model||data.defaultModel,createdAt:now(),updatedAt:now(),messages:[]};data.chats.unshift(chat);data.activeChatId=chat.id;data.activeCopilotId=cp.id;renderAll();queueSave();closeSidebar();$('prompt').focus();}

function inlineMD(value){let s=esc(value);s=s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/gi,(_m,label,url)=>`<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`);s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');s=s.replace(/__(.+?)__/g,'<strong>$1</strong>');s=s.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,'<em>$1</em>');return s;}
function markdownToHTML(src){const lines=String(src||'').replace(/\r\n?/g,'\n').split('\n');let out=[],para=[],listType='',li=[],quote=[],code=null;
 const flushPara=()=>{if(para.length){out.push('<p>'+para.map(inlineMD).join('<br>')+'</p>');para=[];}};
 const flushList=()=>{if(li.length){out.push('<'+listType+'>'+li.map(x=>'<li>'+inlineMD(x)+'</li>').join('')+'</'+listType+'>');li=[];listType='';}};
 const flushQuote=()=>{if(quote.length){out.push('<blockquote>'+quote.map(inlineMD).join('<br>')+'</blockquote>');quote=[];}};
 for(const line of lines){const fence=line.match(/^\s*```(.*)$/);if(code){if(fence){out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');code=null;}else code.push(line);continue;}if(fence){flushPara();flushList();flushQuote();code=[];continue;}if(!line.trim()){flushPara();flushList();flushQuote();continue;}const list=line.match(/^\s*([-*+] |\d+\. )(.*)$/);const heading=line.match(/^(#{1,3})\s+(.+)$/);const quot=line.match(/^>\s?(.*)$/);if(list){flushPara();flushQuote();const kind=/\d/.test(list[1][0])?'ol':'ul';if(listType&&listType!==kind)flushList();listType=kind;li.push(list[2]);continue;}flushList();if(quot){flushPara();quote.push(quot[1]);continue;}flushQuote();if(heading){flushPara();out.push(`<h${heading[1].length}>${inlineMD(heading[2])}</h${heading[1].length}>`);continue;}if(/^\s*---+\s*$/.test(line)){flushPara();out.push('<hr>');continue;}para.push(line);}
 if(code)out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');flushPara();flushList();flushQuote();return out.join('');}
function renderMessages(){const root=$('messages'),chat=activeChat();root.replaceChildren();if(!chat||!chat.messages.length){const cp=copilotById(chat?.copilotId||data.activeCopilotId);const empty=document.createElement('div');empty.className='welcome';empty.innerHTML='<div class="welcome-icon"></div><h1>What can I help with?</h1><p>Stream answers as they are generated, keep separate conversations, and use specialized copilots with their own instructions.</p><span class="welcome-chip"></span>';empty.querySelector('.welcome-icon').textContent=cp.icon;empty.querySelector('.welcome-chip').textContent=cp.name+' · '+modelLabel(chat?.model||data.defaultModel);root.append(empty);return;}

let scrollRequested=false;function scrollBottom(force=false){if(scrollRequested)return;scrollRequested=true;requestAnimationFrame(()=>{scrollRequested=false;const root=$('message-scroll');if(force||root.scrollHeight-root.scrollTop-root.clientHeight<260)root.scrollTop=root.scrollHeight;});}

function requestContents(chat){const turns=[];for(const m of chat.messages){if(m.role==='error'||m.incomplete||m.role==='model'&&!m.text)continue;const parts=m.role==='model'&&Array.isArray(m.apiParts)&&m.apiParts.length?m.apiParts:[{text:m.text}];const last=turns.at(-1);if(last&&last.role===m.role){last.parts.push(...parts);}else turns.push({role:m.role,parts:structuredClone(parts)});}return turns;}
async function parseSSE(response,onChunk){if(!response.body)throw Error('Streaming is unsupported by this browser or API response.');const reader=response.body.getReader(),decoder=new TextDecoder();let leftover='',dataLines=[];

async function generate(chat){if(busy)return;const contents=requestContents(chat);if(!contents.length)throw Error('There is no user message to send.');const cp=copilotById(chat.copilotId),reply={id:id(),role:'model',text:'',createdAt:now(),incomplete:true,apiParts:[]};const ctl=new AbortController();chat.messages.push(reply);busy={controller:ctl,chatId:chat.id,replyId:reply.id};renderTop();renderChatList();renderMessages();scrollBottom(true);

 let finishReason='',blockReason='';await parseSSE(response,chunk=>{const cand=chunk.candidates?.[0];finishReason=cand?.finishReason||finishReason;blockReason=chunk.promptFeedback?.blockReason||blockReason;for(const p of cand?.content?.parts||[]){if(typeof p!=='object'||!p)continue;reply.apiParts.push(p);if(typeof p.text==='string'&&!p.thought){reply.text+=p.text;const active=data.activeChatId===chat.id?document.querySelector(`[data-id="${reply.id}"] .bubble`):null;if(active){active.textContent=reply.text;scrollBottom();}}}});

function send(){if(busy){busy.controller.abort();return;}const input=$('prompt'),chat=activeChat();if(!chat){showToast('Create a chat first.',true);return;}const text=input.value.trim();if(!text)return;const msg={id:id(),role:'user',text,createdAt:now(),incomplete:false};chat.messages.push(msg);if(chat.title==='New conversation')chat.title=text.replace(/\s+/g,' ').slice(0,64);chat.updatedAt=now();input.value='';input.style.height='';renderAll();queueSave();void generate(chat).catch(e=>showToast(cleanError(e),true));}

 if(!creating){$('cp-duplicate').onclick=()=>{const clone={...cp,id:id(),name:cp.name+' (copy)'};data.copilots.push(clone);data.activeCopilotId=clone.id;queueSave();closeModal();renderAll();showToast('Copilot duplicated.');};$('cp-delete').onclick=()=>{if(data.copilots.length===1){panelError('cp-error','You must keep at least one copilot.');return;}if(!confirm('Delete this copilot? Its existing chats will be reassigned to another copilot.'))return;data.copilots=data.copilots.filter(c=>c.id!==cp.id);const fallback=data.copilots[0].id;for(const chat of data.chats)if(chat.copilotId===cp.id)chat.copilotId=fallback;if(data.activeCopilotId===cp.id)data.activeCopilotId=fallback;queueSave();closeModal();renderAll();};}
}
async function refreshModels(silent=false,keyOverride=''){if(!data)return;try{const found=await fetchModels(keyOverride||data.apiKey);data.models=found;if(keyOverride)data.apiKey=keyOverride;if(!found.some(m=>m.name===data.defaultModel))data.defaultModel=found[0].name;for(const c of data.copilots)if(c.model&&!found.some(m=>m.name===c.model))c.model='';queueSave();renderAll();if(!silent)showToast('Loaded '+found.length+' available model(s).');return found;}catch(e){if(!silent)showToast(cleanError(e),true);else setStatus('Saved locally · Could not refresh model list');throw e;}}
function openSettings(){openModal(`<div class="header-inline"><h2>Settings & secure workspace</h2><button class="top-action" id="settings-close">×</button></div><p>Configure your default Gemini model and manage encrypted storage.</p><label>Workspace default model</label><select class="field" id="setting-model"></select><label>Replace Gemini API key (leave empty to keep the existing key)</label><input class="field" type="password" id="setting-key" placeholder="Enter a different API key" autocomplete="off"><div class="modal-actions"><button class="btn" id="refresh-models">Refresh models</button><button class="btn btn-primary" id="save-settings">Save settings</button></div><div class="errorbox" id="settings-error"></div><hr class="modal-sep"><h3>Encrypted backups</h3><p>Export everything — API key, all copilots, default model, chats, and model metadata — to an AES-256-GCM encrypted JSON file. Import replaces this browser's current workspace.</p><div class="form-row"><button class="btn" id="settings-export">⇩ Export encrypted JSON</button><button class="btn" id="settings-import">⇧ Import encrypted JSON</button></div><hr class="modal-sep"><h3>Vault password</h3><p>Change the password that encrypts this browser's local workspace. Your export backups have their own independent passwords.</p><div class="form-row"><input class="field" id="new-vault-pass" type="password" minlength="8" placeholder="New vault password"><input class="field" id="confirm-vault-pass" type="password" minlength="8" placeholder="Confirm new password"></div><button class="btn" id="change-vault-pass" style="margin-top:10px">Change vault password</button><div class="notice">🔐 Local browser storage contains only an encrypted vault. The password is required after every reload. Use the Export button to keep a portable backup, particularly when using a <code>file://</code> URL.</div>`,true);
 fillModelSelect($('setting-model'),data.defaultModel);$('settings-close').onclick=closeModal;$('save-settings').onclick=async()=>{panelError('settings-error','');const key=$('setting-key').value.trim();const model=$('setting-model').value;try{if(key){const found=await fetchModels(key);data.apiKey=key;data.models=found;if(found.some(m=>m.name===model))data.defaultModel=model;else data.defaultModel=found[0].name;for(const c of data.copilots)if(c.model&&!found.some(m=>m.name===c.model))c.model='';$('setting-key').value='';}else data.defaultModel=model;queueSave(10);closeModal();renderAll();showToast('Settings saved. New chats use the default model.');}catch(e){panelError('settings-error',cleanError(e));}};
 $('refresh-models').onclick=async()=>{const button=$('refresh-models');setBusy(button,true,'Refreshing…');panelError('settings-error','');try{await refreshModels(false);fillModelSelect($('setting-model'),data.defaultModel);}catch(e){panelError('settings-error',cleanError(e));}finally{setBusy(button,false,'Refresh models');}};
 $('settings-export').onclick=()=>openExport();$('settings-import').onclick=()=>startImport();$('change-vault-pass').onclick=async()=>{const a=$('new-vault-pass').value,b=$('confirm-vault-pass').value;if(a.length<8||a!==b){panelError('settings-error','New password must be at least 8 characters and match confirmation.');return;}const previousPassword=vaultPassword;vaultPassword=a;const saved=await saveNow();if(!saved){vaultPassword=previousPassword;panelError('settings-error','The password could not be saved. Your previous password is still active; export a backup and try again.');return;}$('new-vault-pass').value='';$('confirm-vault-pass').value='';panelError('settings-error','');showToast('Local vault password changed.');};}
function openExport(){if(!data)return;openModal(`<div class="header-inline"><h2>Export encrypted backup</h2><button class="top-action" id="backup-close">×</button></div><p>Download a password-protected JSON file containing your Gemini API key, custom copilots, all chat histories, default model and workspace settings.</p><div class="notice"><b>Encryption:</b> AES-256-GCM with a key derived using PBKDF2-SHA-256 and a unique random salt (260,000 iterations). No password or unencrypted data is placed into the downloaded file.</div><form id="backup-form"><label>Backup password (at least 8 characters)</label><input class="field" id="backup-pass" type="password" minlength="8" required autocomplete="new-password"><label>Confirm backup password</label><input class="field" id="backup-confirm" type="password" minlength="8" required autocomplete="new-password"><div class="errorbox" id="backup-error"></div><div class="modal-actions"><button class="btn" type="button" id="backup-cancel">Cancel</button><button class="btn btn-primary" type="submit" id="backup-submit" data-label="Encrypt & download JSON">Encrypt & download JSON</button></div></form>`);$('backup-close').onclick=closeModal;$('backup-cancel').onclick=closeModal;$('backup-form').onsubmit=async e=>{e.preventDefault();const password=$('backup-pass').value;if(password.length<8||password!==$('backup-confirm').value){panelError('backup-error','Passwords must match and contain at least 8 characters.');return;}const btn=$('backup-submit');setBusy(btn,true,'Encrypting backup…');try{const box=await seal({type:'backup',app:APP,exportedAt:now(),data},password);const blob=new Blob([JSON.stringify(box,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='xsukax-gemini-backup-'+new Date().toISOString().slice(0,10)+'.encrypted.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);closeModal();showToast('Encrypted JSON backup downloaded. Keep your backup password.');}catch(e){panelError('backup-error',cleanError(e));}finally{setBusy(btn,false,'');}};}
function startImport(){$('import-file').value='';$('import-file').click();}
async function chooseImport(event){const file=event.target.files?.[0];if(!file)return;if(file.size>60*1024*1024){showToast('Backup is too large (maximum 60 MB).',true);return;}let envelope;try{envelope=JSON.parse(await file.text());if(envelope.format!=='xsukax-encrypted-json'||envelope.app!==APP)throw Error('This is not a supported encrypted xsukax backup.');}catch(e){showToast('Invalid JSON backup: '+cleanError(e),true);return;}pendingImport=envelope;
 openModal(`<div class="header-inline"><h2>Import encrypted backup</h2><button class="top-action" id="import-close">×</button></div><p>Enter this backup's password to restore its API key, copilots, models and conversations. <b>This will replace your existing browser workspace.</b></p><div class="notice">The imported backup password will also become the password for the restored local encrypted vault. Existing data will be overwritten only after a successful decrypt.</div><form id="import-form"><label>Backup password</label><input class="field" id="import-pass" type="password" required autocomplete="off"><div class="errorbox" id="import-error"></div><div class="modal-actions"><button class="btn" type="button" id="import-cancel">Cancel</button><button class="btn btn-primary" id="import-submit" type="submit" data-label="Decrypt & restore">Decrypt & restore</button></div></form>`);
 $('import-close').onclick=closeModal;$('import-cancel').onclick=closeModal;$('import-form').onsubmit=async e=>{e.preventDefault();const password=$('import-pass').value,btn=$('import-submit');setBusy(btn,true,'Decrypting…');panelError('import-error','');try{const decoded=await unseal(pendingImport,password);if(decoded.type!=='backup'||decoded.app!==APP)throw Error('This file is not a workspace backup.');const restored=validateData(decoded.data);if(!confirm('Replace all current local chats, copilots, and API settings with this backup?'))return;if(busy){busy.controller.abort();busy=null;}data=restored;vaultPassword=password;await saveNow();pendingImport=null;$('gate').classList.add('hidden');closeModal();renderAll();showToast('Encrypted backup successfully restored.');void refreshModels(true).catch(()=>{});}catch(e){panelError('import-error',cleanError(e));}finally{setBusy(btn,false,'');}};}
async function lock(){if(busy){busy.controller.abort();showToast('Generation stopped before locking.');}await saveNow();await saving;data=null;vaultPassword='';busy=null;$('prompt').value='';$('messages').replaceChildren();closeSidebar();closeModal();gateUnlock();}
function init(){ensureCrypto();try{savedAvailable=!!localStorage.getItem(STORAGE);}catch(e){savedAvailable=false;showToast('Browser storage is unavailable. Use encrypted backup export before closing the page.',true);}if(savedAvailable)gateUnlock();else gateSetup();
 $('new-chat').onclick=()=>createChat();$('new-copilot').onclick=()=>openCopilot();$('settings-button').onclick=openSettings;$('lock-button').onclick=()=>void lock();$('export-button').onclick=openExport;$('clear-chat').onclick=()=>{const chat=activeChat();if(!chat||busy)return;if(!confirm('Clear all messages in this conversation?'))return;chat.messages=[];chat.updatedAt=now();queueSave();renderAll();};$('send-button').onclick=send;$('prompt').addEventListener('input',()=>{const p=$('prompt');p.style.height='auto';p.style.height=Math.min(p.scrollHeight,200)+'px';renderTop();});$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!busy)send();}});
 $('chat-model').onchange=e=>{const chat=activeChat();if(chat)chat.model=e.target.value;else data.defaultModel=e.target.value;queueSave();renderAll();};$('chat-copilot').onchange=e=>{const cid=e.target.value,chat=activeChat();if(chat){if(chat.messages.length&&!confirm('Switching copilots changes the system instructions for this existing chat. Continue?')){renderTop();return;}chat.copilotId=cid;}data.activeCopilotId=cid;queueSave();renderAll();};
 $('sidebar-toggle').onclick=()=>{$('sidebar').classList.toggle('open');$('sidebar-cover').classList.toggle('shown');};$('sidebar-cover').onclick=closeSidebar;$('import-file').onchange=chooseImport;$('modal-overlay').addEventListener('click',e=>{if(e.target===$('modal-overlay'))closeModal();});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalOpen)closeModal();});window.addEventListener('beforeunload',e=>{if(busy||saveTimer||pendingSaves){e.preventDefault();e.returnValue='';}});
}
try{init();}catch(e){$('gate-panel').innerHTML='<h2>Unsupported browser context</h2><p></p>';$('gate-panel').querySelector('p').textContent=cleanError(e);}
})();
</script>
</body>
